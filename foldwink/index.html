    <title>Foldwink — Daily Grouping Puzzle</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #0f1115;
        color: #e8eaf0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
      }
      main {
        max-width: 540px;
        width: 100%;
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        width: 192px;
        margin: 0 auto 36px;
      }
      .grid > div {
        aspect-ratio: 1 / 1;
        border-radius: 14px;
      }
      .grid > div:nth-child(1) { background: #f5c86b; }
      .grid > div:nth-child(2) { background: #8cd28e; }
      .grid > div:nth-child(3) { background: #ef9e9e; }
      .grid > div:nth-child(4) { background: #b49cf0; }
      h1 {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -2px;
        margin: 0 0 8px;
      }
      .by {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #8a8f9a;
        margin: 0 0 36px;
      }
      .desc {
        font-size: 18px;
        line-height: 1.5;
        color: #c4c8d2;
        margin: 0 0 36px;
      }
      .desc strong { color: #e8eaf0; font-weight: 600; }
      .cta {
        display: inline-block;
        background: #8cd28e;
        color: #0f1115;
        text-decoration: none;
        font-weight: 700;
        font-size: 18px;
        padding: 16px 32px;
        border-radius: 14px;
        transition: transform 120ms ease, background 120ms ease;
      }
      .cta:hover { background: #a4dba5; transform: translateY(-1px); }
      .cta:active { transform: translateY(0); }
      .footer {
        margin-top: 48px;
        font-size: 13px;
        color: #6c707a;
      }
      .footer a {
        color: #8a8f9a;
        text-decoration: none;
        border-bottom: 1px solid #2a2e36;
      }
      .footer a:hover { color: #c4c8d2; border-bottom-color: #4a4e56; }
      @media (max-width: 480px) {
        h1 { font-size: 44px; }
        .desc { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="grid" aria-hidden="true">
        <div></div><div></div><div></div><div></div>
      </div>
      <h1>Foldwink</h1>
      <p class="by">BY NEURAL VOID</p>
      <p class="desc">
        A short <strong>daily 4×4 grouping puzzle</strong>.<br/>
        16 cards · 4 hidden groups · 4 mistakes.
      </p>
      <a class="cta" href="https://neural-void.itch.io/foldwink?utm_source=neural-void&amp;utm_medium=referral&amp;utm_campaign=landing">
        Play on itch.io →
      </a>
      <div class="footer">
        <a href="https://neural-void.com/">neural-void.com</a>
        &nbsp;·&nbsp;
        <a href="mailto:foldwink@neural-void.com">foldwink@neural-void.com</a>
      </div>
    </main>
  </body>
</html>
