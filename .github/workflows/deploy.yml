name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose Cloudflare token scope
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Token verify ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('status:', r.get('result',{}).get('status','?'), 'errors:', r.get('errors',[]))"
          echo "=== Accounts visible to token ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts \
            | python3 -c "import sys,json; r=json.load(sys.stdin); [print('-', a.get('id'), a.get('name')) for a in r.get('result',[])]; print('errors:', r.get('errors',[]))"
          echo "=== Pages projects in configured account ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects \
            | python3 -c "import sys,json; r=json.load(sys.stdin); [print('-', p.get('name')) for p in r.get('result') or []]; print('errors:', r.get('errors',[]))"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=neural-void-site --branch=main --commit-dirty=true
